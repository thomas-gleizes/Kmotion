name: Test, Build & Push

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  REGISTRY: forgejo.vpn.internal
  OWNER: kalat

jobs:
  test:
    name: Test server
    runs-on: docker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Run unit tests
        working-directory: ./apps/server
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm test

  # L'extension navigateur n'est plus embarquée dans l'image web : le zip est
  # déposé dans le MinIO de l'infra (bucket `kmotion-extension`) et le backend
  # le relaie (GET /api/3.1/extension/download). Toutes les branches le
  # construisent, seul master le publie — même garde que le push des images.
  extension:
    name: Build & publish extension
    runs-on: docker

    env:
      # API de production, injectée par Vite dans le build.
      VITE_API_URL: https://kmotion.thomasgleizes.fr/api/3.1
      # API S3 de MinIO, servie sur le tailnet par traefik-internal ; le
      # runner la résout via --add-host (cluster-config, tools/forgejo-runner).
      S3_URL: http://s3.vpn.internal
      S3_BUCKET: kmotion-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Build and package
        working-directory: ./apps/extension
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm package

      # Même tag que les images : sert de clé à l'archive historisée.
      - name: Compute the deploy tag
        run: |
          ts=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y%m%dT%H%M%SZ)
          echo "TAG=${ts}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # curl signe lui-même en SigV4 : le client `mc` n'est plus distribué
      # (dl.min.io répond 410), et l'utilisateur MinIO de la CI n'a que
      # s3:PutObject sur ce bucket. `kmotion-extension.zip` est la clé lue par
      # le backend ; `archive/<tag>.zip` garde l'historique pour un rollback.
      - name: Upload to MinIO
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        working-directory: ./apps/extension
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          for key in "archive/$TAG.zip" kmotion-extension.zip; do
            curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" \
              --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" \
              -H "Content-Type: application/zip" \
              -T build/kmotion-extension.zip "$S3_URL/$S3_BUCKET/$key"
          done

  build:
    name: Build ${{ matrix.image }}
    runs-on: docker
    needs: test

    strategy:
      matrix:
        include:
          - image: kmotion
            context: ./apps/server
            file: ./apps/server/Dockerfile
          - image: kmotion-web
            context: ./apps/web
            file: ./apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # Tag triable ET lisible : <date du commit UTC>-<sha court>.
      # Flux (image-reflector) élit le plus récent en triant ces tags dans
      # l'ordre alphabétique, ce qui n'équivaut à l'ordre chronologique que si
      # l'horodatage est en largeur fixe et zéro-padé — d'où l'ISO compact.
      # Il vient de la DATE DU COMMIT, pas de l'heure du build : les deux legs
      # de la matrice produisent le même tag, et il est reproductible.
      # Format partagé avec cluster-config (clusters/core/images.yaml) : ne pas
      # le modifier d'un seul côté.
      - name: Compute the deploy tag
        run: |
          ts=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y%m%dT%H%M%SZ)
          echo "TAG=${ts}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # `docker build` passe par le démon du runner, qui connaît
      # `insecure-registries` et /etc/hosts — pas de buildx/setup-buildx-action,
      # dont le builder BuildKit ignorerait les deux. Les deux nœuds sont amd64.
      - name: Build image
        run: |
          docker build -f "${{ matrix.file }}" \
            -t "$REGISTRY/$OWNER/${{ matrix.image }}:$TAG" "${{ matrix.context }}"

      # Garde-fou : on construit sur toutes les branches pour valider les
      # Dockerfiles, mais seul master pousse. Sans lui, n'importe quelle
      # branche produirait un tag correspondant à la policy Flux et partirait
      # en production.
      - name: Push image
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$OWNER" --password-stdin
          docker push "$REGISTRY/$OWNER/${{ matrix.image }}:$TAG"

# Rien après le push : Flux surveille le registry Forgejo, élit le tag le plus
# récent et écrit lui-même le manifest dans cluster-config. Ce dépôt n'a aucun
# accès à cluster-config.
